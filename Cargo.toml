[workspace]
members = ["crates/*", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheDuke/nagsworth"

[workspace.dependencies]
ns-core = { path = "crates/ns-core" }
ns-platform = { path = "crates/ns-platform" }
ns-tracker = { path = "crates/ns-tracker" }
ns-rules = { path = "crates/ns-rules" }
ns-storage = { path = "crates/ns-storage" }
ns-api = { path = "crates/ns-api" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
humantime-serde = "1"
humantime = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"
rand = "0.9"
base64 = "0.22"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
