[package]
name = "an-app"
description = "activity_nagger tray app: tracking, nags and the dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "activity_nagger"

[[bin]]
name = "activity_nagger"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
an-api.workspace = true
an-core.workspace = true
an-platform.workspace = true
an-rules.workspace = true
an-storage.workspace = true
an-tracker.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
