[package]
name = "ns-app"
description = "Nagsworth tray app: hosts ns-runtime and shows the nags and the dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "nagsworth"

[[bin]]
name = "nagsworth"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ns-core.workspace = true
ns-platform.workspace = true
ns-rules.workspace = true
ns-runtime.workspace = true
ns-storage.workspace = true
ns-update.workspace = true
serde.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
