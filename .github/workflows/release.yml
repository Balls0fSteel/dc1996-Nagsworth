name: Release

# The release files: a tag `v<version>` builds them and attaches them, with a SHA256SUMS over
# all of them, to a draft GitHub release, which the owner checks and publishes
# (docs/RELEASING.md). A version with a suffix (0.2.0-rc.1) is marked as a pre-release.
# Started by hand, it builds the same files as artifacts and makes no release.
#
# - Windows x64: the NSIS installer Tauri's bundler makes (per-user, Nagsworth updates itself
#   from it: crates/ns-update, docs/DECISIONS.md D22), which the job installs, updates in
#   place and uninstalls on the runner (tools/windows_install_test.ps1).
# - Linux x86_64: the .deb and the AppImage.
# - The browser extension's two store zips.
#
# Nagsworth's update check downloads `Nagsworth_<version>_x64-setup.exe` and `SHA256SUMS` from
# the release's files, so those names are part of the app (crates/ns-update/src/version.rs).
# Signing is optional; see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The version, the same everywhere, and a tag that matches it
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tauri=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          npm=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          ui=$(python3 -c 'import json; print(json.load(open("ui/package.json"))["version"])')
          ext=$(python3 -c 'import json; print(json.load(open("extension/package.json"))["version"])')
          for v in "$tauri" "$npm" "$ui" "$ext"; do
            if [ "$v" != "$crate" ]; then
              echo "::error::versions differ: Cargo.toml $crate, tauri.conf.json $tauri, package.json $npm, ui $ui, extension $ext"
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          case "$crate" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  windows:
    needs: version
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix ui
      - name: Import code signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          # Merged over tauri.conf.json by `tauri build --config`.
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } |
            ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.signing.json
      - name: Build the installer
        shell: bash
        run: |
          if [ -f src-tauri/tauri.signing.json ]; then
            npm run tauri -- build --bundles nsis --config src-tauri/tauri.signing.json
          else
            npm run tauri -- build --bundles nsis
          fi
          ls -l target/release/bundle/nsis/
          test -f "target/release/bundle/nsis/Nagsworth_${{ needs.version.outputs.version }}_x64-setup.exe"
      # As a user would run it silently, then as Nagsworth runs it for an update (/S /UPDATE /R
      # /WAITPID=<pid>, waiting for the exiting app), then the silent uninstall: nothing left.
      - name: Install, update in place, uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows_install_test.ps1 `
            -Setup "target/release/bundle/nsis/Nagsworth_${{ needs.version.outputs.version }}_x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/release/bundle/nsis/*-setup.exe

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm ci --prefix extension
      - run: npm run tauri -- build
      - run: npm run ext:package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            extension/dist/*.zip

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # sha256sum's `<hex>  <name>` lines, the names without folders, which is what the app
      # looks its setup up by (crates/ns-update/src/fetch.rs expected_sha256)
      - name: SHA256SUMS
        run: |
          cd files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: files/*
