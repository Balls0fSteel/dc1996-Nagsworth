name: Release

# Builds installers for a tag like v0.2.0 and attaches them to a draft
# GitHub release. Signing is optional; see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm ci --prefix extension
      - name: Import code signing certificate (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          # Merged over tauri.conf.json by `tauri build --config`.
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } |
            ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.signing.json
      - name: Build installers
        shell: bash
        run: |
          if [ -f src-tauri/tauri.signing.json ]; then
            npm run tauri -- build --config src-tauri/tauri.signing.json
          else
            npm run tauri -- build
          fi
      - run: npm run ext:package
        if: runner.os == 'Linux'
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            extension/dist/*.zip
