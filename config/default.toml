# Nagsworth configuration.
#
# The app reads %LOCALAPPDATA%\nagsworth\config.toml (written from this
# file on first start). Every key is optional; missing keys take the values
# shown here. Durations use humantime syntax: "30s", "10m", "1h 30m".

[general]
# The local day starts at this time, so a late-night session counts toward
# the previous day.
day_start = "04:00"
# Reading mode: break timers run on wall clock instead of pausing when there
# is no keyboard or mouse input.
reading_mode = false

[tracking]
poll_ms = 1000
idle_after_s = 120
# Foreground switches shorter than this are merged into the surrounding segment.
min_segment_ms = 2000
# "full" stores window titles, "none" stores only the app.
store_titles = "full"
retention_days = 365
# Hands-on time: seconds that one key press, mouse move or controller input
# counts as hands-on. 0 disables hands-on accounting.
input_window_s = 5
# Rules for the Game category count hands-on time by default
# (idle_policy = "input" instead of "ignore").
hands_on_games = true
# Poll XInput controllers (Windows) so gamepad use counts as input.
gamepad = true

[web]
# "host" stores only the site (example.com), "full" stores the whole URL.
store_url = "host"
include_incognito = false

[api]
port = 47821
bind = "127.0.0.1"

[exercises]
# Suggest exercises during breaks (docs/EXERCISES.md): what to do depends
# on the break's length and on how long you have been at it.
enabled = true
# What you have at the desk: "band" (resistance band), "stairs", "floor"
# (room to lie down). Items that need one are only suggested with it.
equipment = []
# Exercise ids never to suggest (the Settings page lists them).
exclude = []
# Suggest walks; off if there is nowhere to walk. Squats stand in.
walks = true
# Also suggest habits during longer breaks (drink water, daylight).
habits = false
# A soft tick on the break overlay when the routine moves to the next step.
step_sound = false

# Rules. Triggers:
#   interval     every = work time, break_for = rest that resets the timer
#   daily_total  limit = time per local day, renag_every = repeat while over
#   continuous   limit = uninterrupted time, reset_after = rest that resets it
#   schedule     windows = ["HH:MM-HH:MM", ...] when the scope is not allowed
# scope: "any", { category = "Game" | "Work" | "Web" | "Other" }, { app = "game.exe" }
# idle_policy: "pause" (idle time is rest), "ignore" (idle time still counts) or
#   "input" (only the input_window_s after each key, mouse or controller input
#   counts). Game scope defaults to "input" while hands_on_games is on.
# Escalation levels: toast, overlay, lock (lock calls LockWorkStation).
# exercises: false, or { tags = [...] } to limit the suggested exercises.

[[rules]]
id = "micro-break"
name = "Micro-break: eyes and neck"
trigger = { kind = "interval", every = "20m", break_for = "30s" }
escalation = [ { after = "0s", level = "toast" } ]
# exercises: false turns suggestions off for a rule; tags keep them to a
# body region (eyes, neck, shoulders, upper_back, wrists, lower_back, hips,
# legs, walk, cardio, breathing). This one stays at the desk.
exercises = { tags = ["eyes", "neck", "shoulders", "wrists"] }

[[rules]]
id = "move-break"
name = "Move: get up for two minutes"
trigger = { kind = "interval", every = "30m", break_for = "2m" }
escalation = [ { after = "0s", level = "toast" } ]
# A walk, squats or sit-to-stands: light activity every 30 minutes.
exercises = { tags = ["walk", "legs", "hips"] }

[[rules]]
id = "rest-break"
name = "Take a 10 minute break"
trigger = { kind = "interval", every = "60m", break_for = "10m" }
scope = "any"
idle_policy = "pause"
escalation = [ { after = "0s", level = "toast" }, { after = "90s", level = "overlay" } ]  # , { after = "5m", level = "lock" }
snooze = { duration = "5m", max_per_day = 3 }
# No exercises key: the full routine (a walk first, then the rest).

[[rules]]
id = "gaming-daily"
name = "Gaming limit"
scope = { category = "Game" }
trigger = { kind = "daily_total", limit = "2h", renag_every = "15m" }
# idle_policy is left out: "input" (hands-on time) while hands_on_games is on.
escalation = [ { after = "0s", level = "toast" }, { after = "10m", level = "overlay" } ]

[[rules]]
id = "no-late-gaming"
name = "No gaming late at night"
scope = { category = "Game" }
trigger = { kind = "schedule", windows = ["23:00-06:00"] }
escalation = [ { after = "0s", level = "overlay" } ]
